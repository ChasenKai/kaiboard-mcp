name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry using GitHub Actions OIDC.
# The OIDC identity is `repo:ChasenKai/kaiboard-mcp` — this is what proves ownership
# of the `io.github.ChasenKai/*` namespace, so no long-lived token is needed.
#
# 使用 GitHub Actions OIDC 将 server.json 发布到官方 MCP 注册表。
# OIDC 身份为 `repo:ChasenKai/kaiboard-mcp`，以此证明对 `io.github.ChasenKai/*`
# 命名空间的所有权，因此无需任何长期令牌。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # required for OIDC / OIDC 必需
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version || true

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
