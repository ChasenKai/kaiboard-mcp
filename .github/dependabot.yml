version: 2
updates:
  # 运行时与构建期 npm 依赖
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # 开发依赖合并成一个 PR，减少噪音
      dev-dependencies:
        dependency-type: development
      # 生产依赖按 minor/patch 合并
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
